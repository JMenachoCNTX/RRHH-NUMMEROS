<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RRHH NUMMEROS</title>
  <meta name="description" content="Sistema de Recursos Humanos y planillas de sueldos — NUMMEROS by CONTAX">
  <meta name="theme-color" content="#235347">
  <link rel="icon" href="assets/iconos/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/iconos/icono-app-principal.svg">
  <link rel="apple-touch-icon" href="assets/iconos/icono-app-principal-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fuentes/Akshar-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilos.css?v=20261112">
</head>
<body>
  <div class="app" id="app">
    <aside class="lateral" aria-label="Menú principal">
      <!-- El sistema es de NUMMEROS (el logo del cliente va solo en los documentos que se generan) -->
      <a class="marca" href="#/inicio" aria-label="Inicio">
        <img class="logo-claro" src="assets/logos/nummeros-logotipo-horizontal-principal.svg" alt="NUMMEROS">
        <img class="logo-oscuro" src="assets/logos/nummeros-logotipo-horizontal-claro.svg" alt="NUMMEROS">
        <img class="logo-mini logo-mini-claro" src="assets/logos/nummeros-isotipo-principal.svg" alt="">
        <img class="logo-mini logo-mini-oscuro" src="assets/logos/nummeros-isotipo-claro.svg" alt="">
        <small>Recursos Humanos</small>
      </a>
      <nav class="menu" id="menu"></nav>
      <!-- CONTAX: el servicio contable -->
      <div class="pie-menu">
        <div class="firma-marca"><small>Servicio contable</small>
          <img class="logo-claro" src="assets/logos/contax-horizontal-color.svg" alt="CONTAX">
          <img class="logo-oscuro" src="assets/logos/contax-horizontal-blanco.svg" alt="CONTAX">
        </div>
      </div>
    </aside>

    <div class="principal">
      <header class="barra">
        <button class="btn btn-fantasma btn-menu" id="btnMenu" aria-label="Mostrar u ocultar el menú" title="Mostrar u ocultar el menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="titulo" id="tituloVista">Inicio</div>
        <div class="selector-empresa">
          <select id="selEmpresa" aria-label="Empresa activa"></select>
        </div>
        <div class="estado-nube" id="estadoNube" title="Conectando…"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 12.5 3.5 3.5 0 0 0 6 19z"/></svg><span>Conectando…</span></div>
        <button class="btn btn-fantasma btn-sm" id="btnTema" title="Cambiar modo claro / oscuro" aria-label="Cambiar modo claro u oscuro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn btn-fantasma btn-sm btn-salir" id="btnSalir" title="Cerrar sesión" aria-label="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span class="usuario-nube" id="usuarioNube"></span>
        </button>
      </header>
      <main class="contenido" id="vista" tabindex="-1"></main>
    </div>
  </div>

  <div id="impresion"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="vendor/xlsx-js-style.min.js"></script>
  <script src="js/calculos.js?v=20261112"></script>
  <script src="js/util.js?v=20261112"></script>
  <script src="js/nube.js?v=20261112"></script>
  <script src="js/datos.js?v=20261112"></script>
  <script src="js/documentos.js?v=20261112"></script>
  <script src="js/exportar.js?v=20261112"></script>
  <script src="js/importar.js?v=20261112"></script>
  <script src="js/visor.js?v=20261112"></script>
  <script src="js/vistas.js?v=20261112"></script>
  <script src="js/app.js?v=20261112"></script>
</body>
</html>
